name: Send Focus Article

on:
  schedule:
    # 06:00, 09:00, 12:00, 15:00, 20:00 по UTC = 09:00, 12:00, 15:00, 18:00, 23:00 по Киеву
    - cron: '0 6 * * *'
    - cron: '0 9 * * *'
    - cron: '0 12 * * *'
    - cron: '0 15 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  run-sender:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install google-genai requests pytz

      - name: Generate and Send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          VERCEL_URL: ${{ secrets.VERCEL_URL }}
        run: python send_once.py
