<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Фокус-Сфера</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --accent: #d4af37;
      --text: #f0f6fc;
      --muted: #8b949e;
      --border: #30363d;
      --btn-bg: #21262d;
      --btn-hover: #30363d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 14px; padding-bottom: 30px; }
    .header { display: flex; justify-content: space-between; align-items: center; }
    .slot-tag { color: var(--accent); font-weight: 700; font-size: 0.75rem; letter-spacing: 1.5px; text-transform: uppercase; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 22px; line-height: 1.8; }
    h1 { font-size: 1.4rem; margin-bottom: 10px; color: #fff; line-height: 1.35; }
    .meta { font-size: 0.8rem; color: var(--muted); margin-bottom: 18px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    .content { font-size: 0.96rem; color: #c9d1d9; white-space: pre-line; letter-spacing: 0.2px; }
    .actions { display: flex; justify-content: center; margin-top: 12px; }
    .reload-btn {
      background: var(--btn-bg);
      border: 1px solid var(--accent);
      color: #fff;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .reload-btn:active { transform: scale(0.98); background: var(--btn-hover); }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="slot-tag" id="category">Практика мышления</div>
    </div>
    <div class="card">
      <h1 id="title">Загрузка статьи...</h1>
      <div class="meta" id="meta">15–20 минут вдумчивого чтения • Практики из блокнота</div>
      <div class="content" id="content"></div>
    </div>
    <div class="actions">
      <button class="reload-btn" onclick="loadRandomArticle()">🎲 Следующая практика из блокнота</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const library = [
      {
        cat: "Нейробиология детокса",
        title: "5 шагов разрушения белкового узла токсичных мыслей",
        body: `Когда негативная или тревожная мысль захватывает внимание, в мозге это не просто абстрактная идея — это физический белковый нарост на дендритах нейронов. Чтобы изменить физиологию мозга, требуется строгое прохождение пяти фаз осознанного детокса.

Нейронам требуется 21 день сосредоточенной практики для растворения старого белка-«клея» и построения устойчивой здоровой магистрали.

ЭТАПЫ ПРАКТИКИ (15 минут):

1. Осознание (2 минуты):
Поймайте мысль, вызывающую напряжение. Не подавляйте ее. Назовите ее вслух: «Я замечаю беспокойство о дедлайне / финансах / контроле». Позвольте мысли проявиться на экране сознания без самоосуждения.

2. Сосредоточенное размышление (3 минуты):
Направьте пристальное внимание внутрь мысли. Спросите себя: «Откуда исходит этот страх? Что самое худшее может произойти? Является ли эта мысль объективной истиной?». Это фокусированное давление начинает расшатывать белковые соединения на синапсах.

3. Запись на бумаге (3 минуты):
Возьмите лист и ручку. Выпишите все слова, которые приходят в голову относительно этой мысли. Вынесение текста на бумагу буквально вытягивает ментальную энергию из нейронного узла во внешний мир.

4. Ревизия и переосмысление (3 минуты):
Перечитайте написанное свежим взглядом. Спросите себя: «Как я могу перенаправить этот белок-клей в конструктивное русло? Какой противоположный здоровый вывод я создаю прямо сейчас?».

5. Активное осуществление (4 минуты):
Новая мысль не закрепится без физического действия. Выберите микродействие прямо сейчас: сделайте один звонок, уберите предмет со стола или сформулируйте конкретный первый шаг. Выполните его немедленно.`
      },
      {
        cat: "Латеральное мышление де Боно",
        title: "Метод «Среза» и провокационный инструмент «ПРО»",
        body: `Шаблонный мозг постоянно движется по наезженной колее: стимул — стандартная ассоциация — привычный тупик. Логический анализ здесь бессилен, потому что он лишь углубляет старую яму.

Латеральные методы Эдварда де Боно позволяют искусственно повысить чувствительность зон коры за счет случайных провокаций.

ПРАКТИКА 1: МЕТОД СРЕЗА (7 минут)
Срез — это пакет из 5 абсолютно случайных, не связанных логически утверждений об интересующей вас сфере:
1. Задайте задачу (например, развитие проекта, организация пространства, повышение дохода).
2. Напишите 5 произвольных утверждений без оглядки на логику. Например:
   • Подписи на бумажных письмах.
   • Использование высокоэластичной резины.
   • Автобусы, в которых пассажирам доплачивают за проезд.
   • Привлечение в проект садоводов-любителей.
   • Бумага, которая чернеет через 7 дней.
3. Проанализируйте каждое утверждение: какую неожиданную аналогию или скрытый принцип можно применить к вашей задаче?

ПРАКТИКА 2: ПРОВОКАЦИЯ «ПРО» (8 минут)
Слово «ПРО» — это сигнал уму: мы намеренно утверждаем абсурд, чтобы сойти с рельсов логики.
• Сформулируйте провокацию: «ПРО: клиент сам делает всю нашу работу» или «ПРО: у задачи нет срока сдачи».
• Найдите в этом абсурде зерно пользы: как перевернуть процесс, чтобы снять нагрузку с себя?
Зафиксируйте 2 нестандартные идеи в блокнот.`
      },
      {
        cat: "НЛП и Технология Целей",
        title: "Модель ПДПР и создание Неотразимой Цели",
        body: `Большинство людей тратят годы на борьбу с сопротивлением, потому что ставят «правильные», но эмоционально мертвые цели. Цель должна быть настолько притягательной, чтобы внимание приковывалось к ней автоматически.

ПРАКТИКА МОДЕЛИ ПДПР (15 минут):
(Пробуй — Действуй — Пробуй — получай Результат)

1. Калибровка цели:
Сформулируйте ближайшую задачу. Проверьте ее через сенсорные фильтры: что именно вы увидите, услышите и почувствуете в теле, когда результат будет достигнут?

2. Работа с субмодальностями:
Закройте глаза и представьте образ завершенной задачи. Сделайте картинку ярче, добавьте объемный звук, придвиньте изображение ближе к себе. Заметьте, как меняется уровень энергии и мотивации, когда картинка становится кинематографичной.

3. Создание триггера-маркера:
Определите внешний сигнал, который запустит новое поведение: например, касание ручки двери, первый глоток утренней воды или открытие блокнота. Представьте, как при этом сигнале вы мгновенно входите в состояние собранности.

4. Вечерний фильтр-обзор:
Задайте себе контрольный вопрос дня: «Какие 3 действия сегодня продвинули меня к результату, а какие увели в сторону? Что нужно сделать завтра, чтобы усилить фокус?».`
      },
      {
        cat: "Тайм-менеджмент высшей пробы",
        title: "Стратегия «Швейцарского сыра» и правило ABCDE",
        body: `Когда перед вами висит тяжелая, многозадачная проблема, мозг воспринимает ее как угрозу и стремится сбежать в соцсети или уборку. 

Попытка штурмовать скалу целиком вызывает ступор. Настоящая продуктивность строится на методичном «продырявливании» задачи.

ПРАКТИКА «ШВЕЙЦАРСКОГО СЫРА» (15 минут):

1. Выберите самую неприятную задачу («лягушку»), которую вы откладываете уже несколько дней.
2. Откажитесь от мысли сделать ее целиком. Ваша цель — проделать в ней маленькое отверстие за 5 минут.
3. Выберите микроскопический фрагмент: найти один контакт, составить план из 3 пунктов или написать первое предложение.
4. Включите секундомер ровно на 5 минут и погрузитесь в эту точку, не думая обо всем остальном объеме.

ПРАКТИКА МЕТОДА ABCDE:
Выпишите список дел на сегодня и пометьте каждое буквой:
• A — задача первостепенной важности («лягушка», последствия невыполнения серьезны).
• B — задача, которую следует сделать (легкие последствия).
• C — приятное, но необязательное дело (поболтать, полистать ленту).
• D — делегировать немедленно.
• E — вычеркнуть навсегда.

Правило железной дисциплины: никогда не беритесь за задачу B, пока не съедена задача A!`
      },
      {
        cat: "Медитативное перенаправление",
        title: "Протокол «Отвыкания от себя»: Наблюдение и Перенаправление",
        body: `Личность человека — это набор повторяющихся мыслей, эмоциональных реакций и автоматических шаблонов поведения. Пока вы реагируете привычно, вы воспроизводите вчерашний день.

Чтобы выйти из старого сценария, необходимо освоить разделение на Наблюдателя и Автопилот.

ПРАКТИКА МЕДИТАТИВНОГО ПЕРЕНАПРАВЛЕНИЯ (15 минут):

1. Фаза Индукции (3 минуты):
Сядьте прямо, закройте глаза. Переведите внимание на пространство: осознайте пространство между вашими ушами, пространство позади вашей головы, объем воздуха в комнате. Почувствуйте, как спадает напряжение с лобных долей.

2. Фаза Распознавания (4 минуты):
Вспомните привычную автоматическую реакцию: раздражение, нетерпение, чувство нехватки времени или вины. Проследите, где в теле она отзывается сжатием (в горле, в груди, в животе).

3. Фаза Признания и Констатации (3 минуты):
Не сопротивляйтесь этому чувству. Спокойно констатируйте: «Это всего лишь старая нейронная память тела. Это не есть истинное Я». 

4. Фаза Перенаправления (5 минут):
Громко и твердо скажите про себя: «Стоп! Смена кадра!». Мгновенно представьте нового себя: как вы двигаетесь, как дышите, как уверенно принимаете решения. Отрепетируйте это состояние в воображении до появления чувства радостного облегчения.`
      }
    ];

    function render(cat, title, body) {
      document.getElementById('category').textContent = cat;
      document.getElementById('title').textContent = title;
      document.getElementById('content').textContent = body;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    let currentIndex = 0;
    function loadRandomArticle() {
      currentIndex = (currentIndex + 1) % library.length;
      const item = library[currentIndex];
      render(item.cat, item.title, item.body);
    }

    const urlParams = new URLSearchParams(window.location.search);
    const pTitle = urlParams.get('title');
    const pText = urlParams.get('text');
    const pCat = urlParams.get('cat');

    if (pTitle && pText) {
      render(pCat || "Фокус дня", pTitle, pText);
    } else {
      render(library[0].cat, library[0].title, library[0].body);
    }
  </script>
</body>
</html>
